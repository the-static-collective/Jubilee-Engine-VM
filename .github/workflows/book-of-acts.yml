name: book-of-acts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Book of Acts tests
        run: npm run test:book-of-acts

      - name: JUBILEE-T10-001 replay
        run: npm run test:jubilee-t10

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
